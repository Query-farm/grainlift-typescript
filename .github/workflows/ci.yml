name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  toolkit:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Query-farm/grainlift
          path: .upstream/grainlift
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run check:contract
        env:
          GRAINLIFT_CONTRACT: .upstream/grainlift/validation/conformance/contract.json
      - run: npm run check:package
